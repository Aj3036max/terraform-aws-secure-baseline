name: Terraform security checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: fmt / validate / tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.2"
      - name: Format
        run: terraform fmt -check -recursive
      - name: Init (sans backend, aucun accès AWS nécessaire)
        run: terraform init -backend=false
      - name: Validate
        run: terraform validate
      - uses: terraform-linters/setup-tflint@v6
        with:
          cache: true
      - name: TFLint init (téléchargement du plugin AWS)
        run: tflint --init
        env:
          # Évite la limite d'appels anonymes à l'API GitHub lors du téléchargement du plugin
          GITHUB_TOKEN: ${{ github.token }}
      - name: TFLint
        run: tflint --recursive --format compact

  checkov:
    name: Checkov (policy as code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install checkov
      - name: Checkov scan
        run: checkov -d . --config-file .checkov.yml --output cli --output-file-path console,checkov.sarif --output sarif
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: checkov-report
          path: checkov.sarif
